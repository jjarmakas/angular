# IBM MQ Queue Archiver configuration
# Copy this file to a location readable by the integration server's process
# owner, then point the node at it - see README.md for how the file path is
# resolved (mqarchiver.configPath system property / MQARCHIVER_CONFIG_PATH
# env var / default "mqarchiver/archiver.properties").

# Queue manager to connect to (local bindings - the integration server must
# be running on the same machine as this queue manager).
qmgrName=QM1

# Base folder under which Archive_YYYYMMDD subfolders are created.
# Use forward slashes even on Windows.
archiveBasePath=C:/mqarchiver/archive

# Default message-count limit. Any queue at or below this depth is left
# alone; a queue whose current depth exceeds it is fully archived.
messageLimit=1000

# Comma-separated list of queues to monitor.
queues=ORDER.QUEUE,PAYMENT.QUEUE,NOTIFICATION.QUEUE

# Optional per-queue overrides of messageLimit, keyed by queue name.
#queue.ORDER.QUEUE.limit=5000
#queue.PAYMENT.QUEUE.limit=200

# Path to the dmpmqmsg executable. Defaults to "dmpmqmsg", which requires it
# to be on the integration server process's PATH. Set a full path if not.
#dmpmqmsgPath=dmpmqmsg
#dmpmqmsgPath=C:/Program Files/IBM/MQ/bin/dmpmqmsg.exe

# How long to wait for dmpmqmsg to finish archiving one queue, in seconds.
dmpmqmsgTimeoutSeconds=300
